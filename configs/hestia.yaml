# hestia — 央行《金融统计数据报告》抓取与校验
#
# 独立文件、独立装载器（internal/hestia/config.go），不并进 internal/config 的大
# Config：方案报告 5.3.1 的「单一读者原则」——这个文件只有 Atlas 读，Loom 从契约
# JSON 的 thresholds 段取值。
#
# ⚠️ 改这个文件**不需要重新编译**：hestia 每次唤起都重读它。
#    改完请同步递增 config_version，否则「这期用的是哪版配置」在契约里查不出来。

# 不参与任何逻辑，只让「这期用的是哪版配置」一眼可见（方案报告 5.3.2）。
# 手工递增，用日期串。
#
# 2026-09-01（M1c-4 的 TASK-004）：magnitude_ranges 由 54 项扩到 76 项，新增的
# 22 项是当月口径列（*_mom）的**占位**区间，未经标定 —— 见该段的注释。
config_version: "2026-09-01"

storage:
  # 相对路径，按进程 cwd 解析（约束 C8）。plist 的 WorkingDirectory 已指向 runtime；
  # 手工执行时需自行 cd，否则会在错误的 cwd 下静默指向一个不存在的库然后报告「0 期」。
  # `atlas hestia status` 会打印解析后的绝对路径，就是为了让这种情况当场可见。
  db_path: data/hestia.db

discover:
  # 央行「沟通交流 > 新闻发布」栏目。栏目 ID 不写死在代码里（分页模板从页面解析），
  # 但入口 URL 必须给。
  index_url: https://www.pbc.gov.cn/goutongjiaoliu/113456/113469/index.html

  # 每页 15 条、约覆盖 20 天，而报告每月 10–15 日发布 ⇒ 发布约 3 周后掉出第 1 页。
  # 3 页 ≈ 60 天窗口，足以覆盖「连着两天没跑起来」这类中断。
  #
  # ⚠️ 空库首跑会一路翻满 3 页（spec §4.3 定义的行为，不是缺陷）；`--force` 同样
  # 会翻满——那是 --force 的语义。调大它会线性增加首跑与 --force 的请求数。
  max_pages: 3

  # 单次 HTTP 请求上限。央行站点实测响应在秒级；30s 宽到不会误伤慢响应，
  # 又不会让一次卡死把 launchd 的这一轮拖到下一轮唤起。
  timeout: 30s

# 七道闸门的阈值。**每个数字都标出处**——没有出处的阈值等于没有阈值，
# 下一个人既不敢调也不知道调了会怎样。
thresholds:
  # 存款分项加总残差占比上限。
  # M0 三期真实数据实测：7.65% / 8.57% / 9.06%。
  # 0.12 而不是方案报告初稿的 0.02：央行报告里的「其中」是**部分列举**而非穷尽，
  # 四个部门加起来本就不等于总额，±2% 会让每一期都被拦下。
  deposit_sum_tolerance: 0.12

  # 本期残差与前几期残差均值的偏离上限。
  # ±12% 宽到几乎拦不住东西（实测 7.6–9.1%，余量仅 3pct），**漂移检测才是这道闸的
  # 实际价值**：口径突变会让残差跳档，而绝对值仍在容差内。
  deposit_sum_drift_max: 0.03

  # 「短期+中长期+票据 vs 企业合计」的残差占比上限。M0 三期实测 1.16% / 1.42% / 1.58%。
  corp_loan_tolerance: 0.05

  # 社融存量环比变化率上限，**按 period_type 分档**（M1c-2 的 TASK-001）。
  #
  # 为什么分档：Preceding 按 period_type 隔离序列 ⇒ 每年只有一个 h1 期次，h1 的
  # 「上一期」是**去年的 h1**。q1 / h1 / q1_q3 / annual 四种都是年初起累计口径，
  # 相邻两期一律相隔 12 个月，只有 monthly 相隔 1 个月。
  #
  # ⚠️ **五档必须全写**——LoadConfig 会拒绝写了这张表却漏档的配置。
  #    漏掉的那档不是「关掉」，而是**静默继承代码里的默认值**：配置里写的和实际
  #    生效的不一致，且两边都不报错。改窄 monthly 时顺手删一档，那条序列的闸门就
  #    实质放宽了 7.5 倍。
  #
  # ⚠️ 两个数**都仍是占位**，未经真实数据验证——M0 的两份样本里只有一份含社融，
  #    算不出环比。0.15 **不是** 0.02 × 12（线性外推会用「存量线性增长」去定义
  #    「什么叫不线性」，那是循环的），只是按「年度跳变幅度必然显著大于月度」这一
  #    定性事实取的量级。M1c 回填出连续序列后由 M1c-3 用标定结果替换。
  # M1c-3b 的 TASK-005 用回填语料的实测分布标定，取代此前的占位值
  # （0.02 / 0.15，M1b 起就在，代码里的原注释自陈「都未经真实数据验证」）。
  #
  #   档      n   p95       max       取值
  #   monthly 68  0.02291   0.02613   0.05
  #   annual   6  0.13338   0.13338   0.20
  #
  # ⚠️ monthly 0.02 → 0.05 不是「为了让数据通过而放宽」：实测 p95=0.02291 已经
  #    越过旧值 0.02 ⇒ 按旧值回填，至少 5% 的 monthly 期次会被判进 pending，而
  #    --force 对已入权威表的期次是数据层 no-op，**拦错了没有出路**。
  #    0.05 仍拦得住它该拦的：单月环比 5% 按当前存量量级约等于一个月增加 20 万亿元。
  # ⚠️ q1 / h1 / q1_q3 三档 **n=0，是继承 annual、不是标定过的**（语料里这三种
  #    期次的 tsf_stock 相邻期样本数为零）。依据是「四档同为年初起累计口径、相邻
  #    两期一律相隔 12 个月」这一同族论证，强于原来的拍脑袋值，但弱于它们自己的数据。
  # 详见 internal/hestia/thresholds.go 的 defaultStockContinuityMax 注释（含复现命令）。
  stock_continuity_max:
    monthly: 0.05   # 相邻两期相隔 1 个月；实测 n=68, max=0.02613
    q1: 0.20        # 以下四档同为年初起累计口径，相邻两期相隔 12 个月
    h1: 0.20        # ⚠️ 只有 annual 有实测（n=6, max=0.13338），其余三档 n=0
    q1_q3: 0.20
    annual: 0.20

  # 同比字段绝对值上限（百分数）。M0 实测最大 25%，50 留一倍余量。
  yoy_sanity_max: 50

  # —— magnitude_ranges：幅度合理性闸门的区间表（M1c-3b 的 TASK-005 人工标定）——
  #
  # 🔴 **填了这张表，magnitude_sanity 就从 skipped{not_calibrated} 变成真正判定。**
  # 在此之前它恒 skipped，所以判错的代价为零；从这一版起不是了。
  #
  # # 这些区间要抓的是**量级错误**，不是异常值
  #
  # 它防的是「把万亿元当亿元」「小数点错位」「符号反了」这类解析事故（差 3 个
  # 数量级以上），**不是**「这个月增长得比往常快」。所以区间刻意宽于实测分布：
  # 一次误拦的代价是人工介入一期，而闸门本身只是最后一道粗筛。
  #
  # # 为什么不直接用 calibrate 的「建议区间」列
  #
  # 那一列是 [min-(max-min), max+(max-min)]，**宽度正比于历史波动** ⇒ 历史上几乎
  # 不动的字段会得到一个极窄的区间。tsf_stock_entrust 79 期实测只在 10.87–11.45
  # 之间，建议区间是 [10.29, 12.03]——将来它真变化一次就误拦。且存量是**增长**的，
  # 上界必须留出未来若干年的空间，而建议区间只覆盖到 max+(max-min)。
  #
  # # 逐组规则（同组分项共用一套，便于「总量与分项一起过闸」）
  #
  #   存量 / 余额（万亿元）  [实测 min × 0.25, 实测 max × 4]
  #                          下界给 2020 之前更早期次留余地（语料起于 2020，那时
  #                          社融存量远小于现在，收紧下界会批量误拦早期期次）；
  #                          上界按年增约 8–10% 计，4 倍约覆盖 15 年。
  #   增量 / 新增（亿元）    [min<0 ? min×4 : -max×0.5, max×4]
  #                          ytd 可以是净减少，下界必须允许为负。
  #   同比 / 占比（百分数）  [-100, 100]  —— 取**有语义**的边界而非机械扩展：
  #                          -100% = 归零，+100% = 翻倍。社融各大类同比越过它即为错。
  #   利率（百分数）         [0, 30]      —— 利率不为负；30 覆盖历史极端。
  #   fx_reserve（万亿美元） [0.3, 15]    ⚠️ 余量给得最大：**只有 27 期样本**
  #   fx_rate（元/美元）     [2, 30]         （月报无外汇板块，其余字段是 50/52/79）
  #
  # 「余量最大」的口径是**与同类组规则比**，不是「在 54 项里排第一」：这两项若
  # 套用上面的存量组规则会得到 [0.76, 13.68] 与 [1.59, 28.9]，所以它们的区间必须
  # 比那更宽才算「给了额外余量」。初稿写的 [1,10] / [3,15] 其实**比组规则还窄**，
  # 是靠一次独立核对（区间宽度 vs 组规则宽度）发现并订正的。
  # ⚠️ 别用「区间宽度 / 实测宽度」这个比值来判定谁的余量大：实测宽度极小的字段
  #    会自动得到极大的比值（tsf_stock_entrust 79 期只在 10.87–11.45 之间，比值 82.8
  #    全表最高），那是它自己波动小的**副产品**，不是有人给了它余量。
  # 这两项的上界按历史真实范围留足：外汇储备历史上到过约 4 万亿美元、汇率到过
  # 约 8.3 元；区间仍拦得住量级事故（小数点错一位就出界）。
  #
  # 圆整一律**向外**（下界向下、上界向上），只会更宽不会更窄，方向一致可核查。
  #
  # ⚠️ 单位：fields.go 的三类约定（余额存量=万亿元 / 增量新增=亿元 / 同比占比利率=
  #    百分数）**不覆盖最后两个字段**。fx_reserve 原文是万亿美元、fx_rate 是元/美元
  #    ——依据是 extract.go 的 extractFXSection 注释，不是本任务的新决定。
  # ⚠️ 这些数随语料变。换语料后必须重跑标定再改这里：
  #    go run ./cmd/atlas hestia backfill calibrate --dir <语料绝对路径> --allow-incomplete
  # ⚠️ 漏填一个字段**不会报错**：gateMagnitudeSanity 对表里没有的字段 continue，
  #    那个字段的幅度闸就此静默消失。TestShippedConfigLoadsAndIsCalibrated 钉住
  #    「键集合与 fieldOrder 逐项相等」正是为此。
  magnitude_ranges:
    # A.1 社融 · 总量
    tsf_stock:                 {min: 60,      max: 2000,    unit: "万亿元"}
    tsf_stock_yoy:             {min: -100,    max: 100,     unit: "百分数"}
    tsf_flow_ytd:              {min: -200000, max: 1500000, unit: "亿元"}
    # A.1 社融 · 存量分项
    tsf_stock_rmb_loan:        {min: 30,      max: 1200,    unit: "万亿元"}
    tsf_stock_rmb_loan_yoy:    {min: -100,    max: 100,     unit: "百分数"}
    tsf_stock_fx_loan:         {min: 0.2,     max: 10,      unit: "万亿元"}
    tsf_stock_fx_loan_yoy:     {min: -100,    max: 100,     unit: "百分数"}
    tsf_stock_entrust:         {min: 2,       max: 50,      unit: "万亿元"}
    tsf_stock_entrust_yoy:     {min: -100,    max: 100,     unit: "百分数"}
    tsf_stock_trust:           {min: 0.9,     max: 30,      unit: "万亿元"}
    tsf_stock_trust_yoy:       {min: -100,    max: 100,     unit: "百分数"}
    tsf_stock_bankaccept:      {min: 0.4,     max: 17,      unit: "万亿元"}
    tsf_stock_bankaccept_yoy:  {min: -100,    max: 100,     unit: "百分数"}
    tsf_stock_corp_bond:       {min: 5,       max: 150,     unit: "万亿元"}
    tsf_stock_corp_bond_yoy:   {min: -100,    max: 100,     unit: "百分数"}
    tsf_stock_govt_bond:       {min: 9,       max: 420,     unit: "万亿元"}
    tsf_stock_govt_bond_yoy:   {min: -100,    max: 100,     unit: "百分数"}
    tsf_stock_equity:          {min: 1.8,     max: 51,      unit: "万亿元"}
    tsf_stock_equity_yoy:      {min: -100,    max: 100,     unit: "百分数"}
    # A.1 社融 · 增量分项（年初至今累计，可为净减少）
    tsf_flow_rmb_loan_ytd:     {min: -120000, max: 890000,  unit: "亿元"}
    tsf_flow_govt_bond_ytd:    {min: -70000,  max: 560000,  unit: "亿元"}
    tsf_flow_corp_bond_ytd:    {min: -23000,  max: 180000,  unit: "亿元"}
    tsf_flow_fx_loan_ytd:      {min: -22000,  max: 14000,   unit: "亿元"}
    tsf_flow_entrust_ytd:      {min: -38000,  max: 15000,   unit: "亿元"}
    tsf_flow_trust_ytd:        {min: -81000,  max: 16000,   unit: "亿元"}
    tsf_flow_bankaccept_ytd:   {min: -20000,  max: 24000,   unit: "亿元"}
    tsf_flow_equity_ytd:       {min: -7000,   max: 50000,   unit: "亿元"}
    # A.1 社融 · 增量当月（M1c-4 的 TASK-004）
    #
    # 🔴 **本组区间未经标定，占位待 M1c-4 的 TASK-010 重标。**
    #
    # 为什么只能是占位：存在循环依赖 —— 填表要 *_mom 的实测分布 → 分布要 TASK-005
    # 的抽取路由跑通 → 跑通要 go test 全绿 → 全绿要这张表填好（键集合必须与
    # fieldOrder 逐项相等）。占位是唯一的破环点。
    # 先例是 thresholds.go 的 stock_continuity_max 三档 n=0：值写下来，注释写明
    # 它不是标定过的。
    #
    # 取法：**逐项照抄对应 *_ytd 字段的现有区间**。两者是同一批数据的两种口径，
    # 量级上当月 ⊂ 累计的量程（累计是当月的逐月叠加），所以 ytd 的区间对 mom 一定
    # 偏宽——偏宽的占位只会漏拦，不会误拦，而误拦会让整期数据卡在 pending。
    #
    # ⚠️ **不要把这组数当成标定结果引用。** 上一轮 deposit_sum_tolerance 的 0.12
    # 就是这么走样的：出自 M0 三样本，被下游写成「实测残差**稳定在** 7.6–9.1%」。
    tsf_flow_mom:              {min: -200000, max: 1500000, unit: "亿元"}
    tsf_flow_rmb_loan_mom:     {min: -120000, max: 890000,  unit: "亿元"}
    tsf_flow_govt_bond_mom:    {min: -70000,  max: 560000,  unit: "亿元"}
    tsf_flow_corp_bond_mom:    {min: -23000,  max: 180000,  unit: "亿元"}
    tsf_flow_fx_loan_mom:      {min: -22000,  max: 14000,   unit: "亿元"}
    tsf_flow_entrust_mom:      {min: -38000,  max: 15000,   unit: "亿元"}
    tsf_flow_trust_mom:        {min: -81000,  max: 16000,   unit: "亿元"}
    tsf_flow_bankaccept_mom:   {min: -20000,  max: 24000,   unit: "亿元"}
    tsf_flow_equity_mom:       {min: -7000,   max: 50000,   unit: "亿元"}
    # A.2 货币供应量
    m2:                        {min: 49,      max: 1500,    unit: "万亿元"}
    m2_yoy:                    {min: -100,    max: 100,     unit: "百分数"}
    m1:                        {min: 14,      max: 480,     unit: "万亿元"}
    m1_yoy:                    {min: -100,    max: 100,     unit: "百分数"}
    m0:                        {min: 1.9,     max: 61,      unit: "万亿元"}
    m0_yoy:                    {min: -100,    max: 100,     unit: "百分数"}
    # A.3 存款
    deposit_balance:           {min: 48,      max: 1400,    unit: "万亿元"}
    deposit_balance_yoy:       {min: -100,    max: 100,     unit: "百分数"}
    deposit_flow_ytd:          {min: -140000, max: 1100000, unit: "亿元"}
    deposit_household_ytd:     {min: -90000,  max: 720000,  unit: "亿元"}
    deposit_corp_ytd:          {min: -130000, max: 270000,  unit: "亿元"}
    deposit_fiscal_ytd:        {min: -13000,  max: 89000,   unit: "亿元"}
    deposit_nbfi_ytd:          {min: -45000,  max: 270000,  unit: "亿元"}
    # A.3 存款 · 当月（M1c-4 的 TASK-004）
    # 🔴 未经标定，占位待 M1c-4 的 TASK-010 重标；取法同上（照抄对应 *_ytd 区间）。
    deposit_flow_mom:          {min: -140000, max: 1100000, unit: "亿元"}
    deposit_household_mom:     {min: -90000,  max: 720000,  unit: "亿元"}
    deposit_corp_mom:          {min: -130000, max: 270000,  unit: "亿元"}
    deposit_fiscal_mom:        {min: -13000,  max: 89000,   unit: "亿元"}
    deposit_nbfi_mom:          {min: -45000,  max: 270000,  unit: "亿元"}
    # A.4 贷款
    loan_balance:              {min: 38,      max: 1200,    unit: "万亿元"}
    loan_balance_yoy:          {min: -100,    max: 100,     unit: "百分数"}
    loan_flow_ytd:             {min: -120000, max: 910000,  unit: "亿元"}
    loan_hh_short_ytd:         {min: -38000,  max: 80000,   unit: "亿元"}
    loan_hh_mlt_ytd:           {min: -31000,  max: 250000,  unit: "亿元"}
    loan_corp_total_ytd:       {min: -90000,  max: 720000,  unit: "亿元"}
    loan_corp_short_ytd:       {min: -25000,  max: 200000,  unit: "亿元"}
    loan_corp_mlt_ytd:         {min: -68000,  max: 550000,  unit: "亿元"}
    loan_bill_ytd:             {min: -60000,  max: 120000,  unit: "亿元"}
    loan_nbfi_ytd:             {min: -19000,  max: 24000,   unit: "亿元"}
    # A.4 贷款 · 当月（M1c-4 的 TASK-004）
    # 🔴 未经标定，占位待 M1c-4 的 TASK-010 重标；取法同上（照抄对应 *_ytd 区间）。
    loan_flow_mom:             {min: -120000, max: 910000,  unit: "亿元"}
    loan_hh_short_mom:         {min: -38000,  max: 80000,   unit: "亿元"}
    loan_hh_mlt_mom:           {min: -31000,  max: 250000,  unit: "亿元"}
    loan_corp_total_mom:       {min: -90000,  max: 720000,  unit: "亿元"}
    loan_corp_short_mom:       {min: -25000,  max: 200000,  unit: "亿元"}
    loan_corp_mlt_mom:         {min: -68000,  max: 550000,  unit: "亿元"}
    loan_bill_mom:             {min: -60000,  max: 120000,  unit: "亿元"}
    loan_nbfi_mom:             {min: -19000,  max: 24000,   unit: "亿元"}
    # A.5 利率与外部
    rate_ibo:                  {min: 0,       max: 30,      unit: "百分数"}
    rate_repo:                 {min: 0,       max: 30,      unit: "百分数"}
    fx_reserve:                {min: 0.3,     max: 15,      unit: "万亿美元"}
    fx_rate:                   {min: 2,       max: 30,      unit: "元/美元"}

  # caliber_exemptions **有意不写**：
