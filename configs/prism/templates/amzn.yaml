# Prism 财报桥模板：只定义分部与 XBRL member 映射。主干流（收入→毛利→营利→净利）
# 不在此配置（AD-5），由 periods 引擎从 fundamental_q 自动构建。
# xbrl_member = 实例文档 explicitMember 去命名空间后的 local name。
