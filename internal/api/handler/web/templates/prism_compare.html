<!-- internal/api/handler/web/templates/prism_compare.html -->
{{define "content"}}
<div class="space-y-4">
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div class="flex flex-wrap gap-2" id="symbol-picker">
      {{range .Options}}
      <label class="flex items-center gap-1 text-sm px-2 py-1 rounded border cursor-pointer bg-white dark:bg-gray-800">
        <input type="checkbox" value="{{.Symbol}}" data-name="{{.Name}}"> {{.Name}}
        <span class="text-xs text-gray-400">{{.Symbol}}</span>
      </label>
      {{end}}
    </div>
    <div id="window-btns" class="flex gap-1">
      <button data-w="1y" class="px-2 py-1 text-sm rounded bg-gray-200 dark:bg-gray-700">1Y</button>
      <button data-w="3y" class="px-2 py-1 text-sm rounded bg-gray-200 dark:bg-gray-700">3Y</button>
      <button data-w="5y" class="px-2 py-1 text-sm rounded bg-blue-600 text-white">5Y</button>
      <button data-w="max" class="px-2 py-1 text-sm rounded bg-gray-200 dark:bg-gray-700">MAX</button>
    </div>
  </div>
  <div class="rounded-lg border bg-white dark:bg-gray-800 p-2"><div id="compare-chart" style="height:420px"></div></div>
  <div class="rounded-lg border bg-white dark:bg-gray-800 p-4 overflow-x-auto">
    <table class="w-full text-sm" id="cross-table">
      <thead><tr class="text-left text-gray-500">
        <th class="py-1">标的</th><th>PE(TTM)</th><th>10Y 分位</th><th>5Y 分位</th><th>数据源</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script src="/static/echarts.min.js"></script>
<script>
(function () {
  var MAX = 8;
  var chart = echarts.init(document.getElementById('compare-chart'));
  var win = '5y';

  function selected() {
    return Array.from(document.querySelectorAll('#symbol-picker input:checked'))
      .map(function (i) { return { symbol: i.value, name: i.dataset.name }; });
  }

  function render() {
    var sel = selected();
    if (!sel.length) { chart.clear(); return; }
    Promise.all(sel.map(function (s) {
      return fetch('/api/prism/series?symbol=' + encodeURIComponent(s.symbol) + '&window=' + win)
        .then(function (r) { return r.json(); });
    })).then(function (all) {
      chart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { bottom: 0 },
        xAxis: { type: 'time' },
        yAxis: { type: 'value', scale: true, name: 'PE(TTM)' },
        series: all.map(function (d, i) {
          return { name: sel[i].name, type: 'line', showSymbol: false,
            data: d.dates.map(function (dt, j) { return [dt, d.pe_ttm[j]]; }) };
        }),
        grid: { left: 48, right: 16, bottom: 48 }
      }, true);
      var tbody = document.querySelector('#cross-table tbody');
      tbody.innerHTML = '';
      all.forEach(function (d, i) {
        var last = d.dates.length - 1;
        function fmt(v) { return (v === null || v === undefined) ? '—' : Number(v).toFixed(1); }
        tbody.insertAdjacentHTML('beforeend', '<tr class="border-t">' +
          '<td class="py-1">' + sel[i].name + ' <span class="text-xs text-gray-400">' + d.symbol + '</span></td>' +
          '<td>' + fmt(d.pe_ttm[last]) + '</td>' +
          '<td>' + fmt(d.pctl_10y[last]) + '</td>' +
          '<td>' + fmt(d.pctl_5y[last]) + '</td>' +
          '<td class="text-xs text-gray-400">' + d.source + '</td></tr>');
      });
    });
  }

  document.querySelectorAll('#symbol-picker input').forEach(function (cb) {
    cb.addEventListener('change', function () {
      if (selected().length > MAX) { cb.checked = false; return; }
      render();
    });
  });
  document.querySelectorAll('#window-btns button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#window-btns button').forEach(function (b) {
        b.className = 'px-2 py-1 text-sm rounded bg-gray-200 dark:bg-gray-700';
      });
      btn.className = 'px-2 py-1 text-sm rounded bg-blue-600 text-white';
      win = btn.dataset.w; render();
    });
  });
  window.addEventListener('resize', function () { chart.resize(); });
})();
</script>
{{end}}
