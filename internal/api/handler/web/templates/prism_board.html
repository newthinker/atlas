{{define "content"}}
<div class="space-y-4">
  <div class="flex items-center gap-2 flex-wrap">
    <a href="/prism/board" class="px-3 py-1 rounded text-sm {{if not .ActiveGroup}}bg-blue-600 text-white{{else}}bg-gray-200 dark:bg-gray-700{{end}}">全部</a>
    {{$active := .ActiveGroup}}
    {{range .Groups}}
    <a href="/prism/board?group={{.}}" class="px-3 py-1 rounded text-sm {{if eq . $active}}bg-blue-600 text-white{{else}}bg-gray-200 dark:bg-gray-700{{end}}">{{.}}</a>
    {{end}}
    <a href="/prism/compare" class="ml-auto px-3 py-1 rounded text-sm bg-gray-200 dark:bg-gray-700">对比</a>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    {{range .Cards}}
    <!-- 卡片外层由 <a> 改为 <div>：财务趋势入口是卡片内的第二个链接，
         而 <a> 不能嵌套 <a>。主体仍整块可点，跳估值详情。 -->
    <div class="rounded-lg border hover:shadow-md bg-white dark:bg-gray-800">
    <a href="/prism/detail/{{.Symbol}}" class="block p-4 pb-2">
      <div class="flex justify-between items-start">
        <div>
          <div class="font-semibold">{{.Name}}</div>
          <div class="text-xs text-gray-500">{{.Symbol}} · {{.Group}}</div>
        </div>
        <span class="text-xs px-2 py-0.5 rounded
          {{if eq .Status "low"}}bg-green-100 text-green-700
          {{else if eq .Status "high"}}bg-red-100 text-red-700
          {{else}}bg-gray-100 text-gray-600{{end}}">{{.StatusZH}}</span>
      </div>
      <div class="mt-3 grid grid-cols-3 text-sm">
        <div><div class="text-gray-500 text-xs">PE(TTM)</div><div>{{.PETTM}}</div></div>
        <div><div class="text-gray-500 text-xs">PB</div><div>{{.PB}}</div></div>
        <div><div class="text-gray-500 text-xs">分位</div><div>{{.Pctl}}%</div></div>
      </div>
      <div class="mt-2 h-1.5 rounded bg-gray-200 dark:bg-gray-700">
        <div class="h-1.5 rounded bg-blue-500" style="width: {{.Pctl}}%"></div>
      </div>
      <div class="mt-2 text-xs text-gray-400">数据至 {{.AsOf}} · {{.Source}}</div>
    </a>
    <div class="px-4 pb-3 text-xs">
      <a href="/prism/fundamental/{{.Symbol}}" class="text-blue-600 hover:underline">财务趋势</a>
    </div>
    </div>
    {{end}}
  </div>
</div>
{{end}}
